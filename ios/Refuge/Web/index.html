<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Refuge — Catholic Prayer Companion</title>
<meta name="description" content="Short prayers, Scripture, and words of the saints for whatever you are carrying — swipe until peace returns.">

<style>
  :root {
    --bg: #0a0f1e;
    --card: #111a35;
    --line: #223055;
    --gold: #e8c368;
    --gold-dim: #b99b52;
    --text: #f0ecdf;
    --muted: #9aa4c4;
    --serif: "New York", "Iowan Old Style", Palatino, Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  body {
    background: var(--bg); color: var(--text); font-family: var(--sans);
    min-height: 100dvh; -webkit-font-smoothing: antialiased;
    -webkit-user-select: none; user-select: none;
  }

  /* ═══ Home screen ═══ */
  #home {
    max-width: 480px; margin: 0 auto; min-height: 100dvh;
    padding: calc(env(safe-area-inset-top) + 34px) 22px calc(env(safe-area-inset-bottom) + 30px);
    display: flex; flex-direction: column;
  }
  #home .cross { text-align: center; color: var(--gold); font-size: 30px; margin-bottom: 12px; font-family: var(--serif); }
  #home h1 {
    font-family: var(--serif); text-align: center; font-weight: 600;
    font-size: 32px; letter-spacing: .01em; color: var(--text);
  }
  #home .sub {
    text-align: center; color: var(--muted); font-size: 14px;
    margin: 10px 0 30px; line-height: 1.5;
  }
  .chips { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .chip {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 15px 14px; color: var(--text); text-align: left; cursor: pointer;
    font-family: var(--sans); font-size: 16px; font-weight: 600;
  }
  .chip small { display: block; font-weight: 400; font-size: 11.5px; color: var(--muted); margin-top: 3px; }
  .chip:active { border-color: var(--gold-dim); transform: scale(.98); }
  .chip.wide { grid-column: 1 / -1; text-align: center; }
  .chip.wide small { display: inline; margin-left: 6px; }

  .or {
    display: flex; align-items: center; gap: 12px; margin: 24px 0 14px;
    color: var(--muted); font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
  }
  .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .typebox { display: flex; gap: 8px; }
  .typebox input {
    flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 13px;
    color: var(--text); font-family: var(--sans); font-size: 16px; padding: 14px 16px;
    outline: none; -webkit-user-select: text; user-select: text;
  }
  .typebox input::placeholder { color: #5e6a8f; }
  .typebox input:focus { border-color: var(--gold-dim); }
  .typebox button {
    background: var(--gold); border: 0; border-radius: 13px; padding: 0 20px;
    font-family: var(--sans); font-size: 15px; font-weight: 700; color: #241d0c; cursor: pointer;
  }
  .typebox button:active { transform: scale(.97); }
  #home footer {
    margin-top: auto; padding-top: 26px; text-align: center;
    color: #4c577c; font-size: 11px; line-height: 1.7; font-family: var(--serif); font-style: italic;
  }

  /* ═══ Feed ═══ */
  #feed {
    display: none; position: fixed; inset: 0; overflow-y: scroll;
    scroll-snap-type: y mandatory; scrollbar-width: none; background: #000;
  }
  #feed::-webkit-scrollbar { display: none; }
  #feed.on { display: block; }
  .slide {
    position: relative; height: 100dvh; scroll-snap-align: start; scroll-snap-stop: always;
    overflow: hidden; display: flex; align-items: center; justify-content: center;
  }
  .slide .art { position: absolute; inset: 0; }
  .slide .art svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .slide .art img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; filter: brightness(.6) saturate(.92);
  }
  .slide .veil { position: absolute; inset: 0; background: rgba(2, 4, 10, .56); }
  .slide .content {
    position: relative; z-index: 2; max-width: 400px; padding: 0 30px; text-align: center;
  }
  .slide .txt {
    font-family: var(--serif); font-size: 26px; line-height: 1.42; font-weight: 600;
    letter-spacing: .045em; color: #fff; text-shadow: 0 2px 18px rgba(0,0,0,.85);
    word-spacing: .12em;
  }
  .slide .txt.long { font-size: 21px; }
  .slide .src {
    margin-top: 18px; font-family: var(--sans); font-size: 12.5px; letter-spacing: .22em;
    text-transform: uppercase; color: rgba(240, 236, 223, .82);
    text-shadow: 0 1px 10px rgba(0,0,0,.9);
  }
  .slide .home-btn {
    margin-top: 30px; background: rgba(232, 195, 104, .92); border: 0; border-radius: 12px;
    padding: 13px 26px; font-family: var(--sans); font-size: 15px; font-weight: 700;
    color: #241d0c; cursor: pointer;
  }
  .feed-top {
    position: fixed; top: 0; left: 0; right: 0; z-index: 5;
    display: flex; align-items: center; justify-content: space-between;
    padding: calc(env(safe-area-inset-top) + 14px) 18px 10px;
    pointer-events: none;
  }
  .feed-top .back {
    pointer-events: auto; background: none; border: 0; color: #fff; cursor: pointer;
    font-size: 26px; line-height: 1; padding: 6px 10px 6px 0;
    text-shadow: 0 1px 8px rgba(0,0,0,.8);
  }
  .feed-top .cat {
    font-family: var(--sans); font-size: 12px; letter-spacing: .24em; text-transform: uppercase;
    color: rgba(255,255,255,.85); text-shadow: 0 1px 8px rgba(0,0,0,.8);
  }
  .feed-top .sound {
    pointer-events: auto; background: none; border: 0; cursor: pointer;
    font-family: var(--sans); font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
    color: rgba(255,255,255,.85); text-shadow: 0 1px 8px rgba(0,0,0,.8);
    padding: 6px 0 6px 10px; min-width: 64px; text-align: right;
  }
  .feed-top .sound.off { opacity: .45; text-decoration: line-through; }
  .hint {
    position: absolute; bottom: calc(env(safe-area-inset-bottom) + 22px); left: 0; right: 0;
    z-index: 3; text-align: center; color: rgba(255,255,255,.85);
    font-family: var(--sans); font-size: 15px; text-shadow: 0 1px 8px rgba(0,0,0,.9);
    animation: bob 2.2s ease-in-out infinite;
  }
  .hint .arr { display: block; font-size: 17px; margin-top: 2px; }
  @keyframes bob { 0%,100% { transform: translateY(0); opacity: .85; } 50% { transform: translateY(6px); opacity: 1; } }
</style>
</head>
<body>

<!-- ═══════════ HOME ═══════════ -->
<div id="home">
  <div class="cross">✠</div>
  <h1>Refuge</h1>
  <p class="sub">What are you carrying today?<br>Pray each word once, then swipe for the next —<br>stay as long as you need.</p>

  <div class="chips" id="chips"></div>

  <div class="or">or tell Him</div>
  <form class="typebox" id="typeForm">
    <input type="text" id="typeInput" placeholder="I'm struggling with…" autocomplete="off" enterkeyhint="go">
    <button type="submit">Pray</button>
  </form>

  <footer>
    "Come to me, all you that labour and are burdened,<br>and I will refresh you." — Matthew 11:28
  </footer>
</div>

<!-- ═══════════ FEED ═══════════ -->
<div id="feed">
  <div class="feed-top">
    <button class="back" id="backBtn" aria-label="Back">←</button>
    <div class="cat" id="feedCat"></div>
    <button class="sound" id="soundBtn" aria-label="Toggle chant">♪ chant</button>
  </div>
</div>

/* ═══════════════ STAINED-GLASS ART (guaranteed fallback) ═══════════════ */

const PALETTES = [
  ['#27447c','#7a2733','#b08a2e','#2e5e46','#5b3a78','#1e3260'],
  ['#7a2733','#27447c','#2e5e46','#b08a2e','#28455e','#5e2440'],
  ['#2e5e46','#b08a2e','#27447c','#7a2733','#3d6a8a','#4a2c66'],
  ['#5b3a78','#b08a2e','#7a2733','#27447c','#2e5e46','#8a3d24'],
];

function mulberry(seed) {
  let a = seed >>> 0;
  return () => {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

const LEAD = '#100c08';

function windowSVG(motif, seed) {
  const rnd = mulberry(seed);
  const pal = PALETTES[Math.floor(rnd() * PALETTES.length)];
  const W = 390, H = 844;
  let s = '';
  const cols = 5, rows = 10;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const x = c * W / cols + (rnd() - .5) * 14;
      const y = r * H / rows + (rnd() - .5) * 14;
      const w = W / cols + 16, h = H / rows + 16;
      const col = pal[Math.floor(rnd() * pal.length)];
      const o = .75 + rnd() * .25;
      s += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w}" height="${h}" fill="${col}" opacity="${o.toFixed(2)}" stroke="${LEAD}" stroke-width="5"/>`;
    }
  }
  const cx = W / 2, cy = H * .42;
  for (let i = 5; i >= 1; i--) {
    const rad = i * 52;
    const col = pal[(i + 1) % pal.length];
    s += `<circle cx="${cx}" cy="${cy}" r="${rad}" fill="${col}" opacity=".5" stroke="${LEAD}" stroke-width="6"/>`;
  }
  for (let i = 0; i < 12; i++) {
    const a = i * Math.PI / 6;
    s += `<line x1="${cx}" y1="${cy}" x2="${(cx + Math.cos(a) * 260).toFixed(1)}" y2="${(cy + Math.sin(a) * 260).toFixed(1)}" stroke="${LEAD}" stroke-width="5"/>`;
  }
  s += `<circle cx="${cx}" cy="${cy}" r="118" fill="#0e1730" stroke="${LEAD}" stroke-width="8"/>`;
  s += `<circle cx="${cx}" cy="${cy}" r="118" fill="url(#glow)"/>`;
  s += motifSVG(motif, cx, cy);
  s += `<rect width="${W}" height="${H}" fill="url(#shaft)" opacity=".35"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="glow" cx="50%" cy="45%" r="65%">
        <stop offset="0%" stop-color="#f3dfa2" stop-opacity=".5"/>
        <stop offset="60%" stop-color="#f3dfa2" stop-opacity=".08"/>
        <stop offset="100%" stop-color="#f3dfa2" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="shaft" x1="0" y1="0" x2=".4" y2="1">
        <stop offset="0%" stop-color="#fff8e0" stop-opacity=".8"/>
        <stop offset="45%" stop-color="#fff8e0" stop-opacity="0"/>
      </linearGradient>
    </defs>${s}</svg>`;
}

        <rect x="${cx-7}" y="${cy+10}" width="14" height="34"/>

    case 'anchor':
      return `<g ${gl}>
        <circle cx="${cx}" cy="${cy-52}" r="12"/>

      return `<g fill="none" stroke="#7a6a3a" stroke-width="8" stroke-linecap="round">
        <circle cx="${cx}" cy="${cy}" r="52"/>

        <path d="M ${cx-52} ${cy} l -14 -10 M ${cx+52} ${cy} l 14 10 M ${cx} ${cy-52} l 8 -14 M ${cx} ${cy+52} l -8 14 M ${cx-38} ${cy-38} l -12 -12 M ${cx+38} ${cy+38} l 12 12 M ${cx+38} ${cy-38} l 12 -12 M ${cx-38} ${cy+38} l -12 12"/>

    default:
      return `<g><rect x="${cx-13}" y="${cy-72}" width="26" height="150" ${g}/><rect x="${cx-52}" y="${cy-32}" width="104" height="26" ${g}/></g>`;

}

/* ═══════════════ HOLY IMAGE BACKGROUNDS ═══════════════
   Local art (art/1.jpg … art/16.jpg — drop your own in) is preferred;
   then famous public-domain sacred paintings hotlinked from Wikimedia
   Commons. Anything that fails to load falls back to stained glass. */

const WM = f => 'https://commons.wikimedia.org/wiki/Special:FilePath/' + encodeURIComponent(f) + '?width=1080';
const LOCAL_ART = Array.from({ length: 16 }, (_, i) => 'art/' + (i + 1) + '.jpg');
const REMOTE_ART = [
  WM('Rembrandt Christ in the Storm on the Lake of Galilee.jpg'),
  WM('Spas vsederzhitel sinay.jpg'),
  WM('Bloch-SermonOnTheMount.jpg'),
  WM('Rembrandt Harmensz van Rijn - Return of the Prodigal Son - Google Art Project.jpg'),
  WM('Giovanni Battista Salvi da Sassoferrato - The Virgin in Prayer - Google Art Project.jpg'),
  WM('Bartolomé Esteban Murillo - The Immaculate Conception of Los Venerables - Google Art Project.jpg'),
  WM('Christ in Gethsemane.jpg'),
  WM('Guido Reni - Saint Joseph and the Christ Child - Google Art Project.jpg'),
];

let artPool = store.get('refuge.artPool', []).filter(u => LOCAL_ART.includes(u) || REMOTE_ART.includes(u));
let artProbed = false;

function probeArt() {
  if (artProbed) return;
  artProbed = true;
  [...LOCAL_ART, ...REMOTE_ART].filter(u => !artPool.includes(u)).forEach(u => {
    const im = new Image();
    im.onload = () => {
      if (im.naturalWidth > 50 && !artPool.includes(u)) {
        artPool.push(u);
        store.set('refuge.artPool', artPool);
      }
    };
    im.src = u;
  });
}

/* ═══════════════ CHANT ═══════════════
   Real Gregorian chant plays if audio files exist (audio/chant1.mp3 …
   audio/chant4.mp3 — drop them in). Until then, a soft generated
   sacred drone keeps the atmosphere. Toggle in the feed header. */

let soundOn = store.get('refuge.sound', true);
let audioStarted = false;
let chantEl = null;         // <audio> when real chant files exist
let chantTracks = [];       // discovered playable files
let chantIndex = 0;
let ac = null;              // AudioContext for generated drone
let droneMaster = null;
let droneTimer = null;

const CHANT_FILES = ['audio/chant1.mp3', 'audio/chant2.mp3', 'audio/chant3.mp3', 'audio/chant4.mp3'];

function probeChant() {
  return Promise.all(CHANT_FILES.map(src => new Promise(res => {
    const a = new Audio();
    a.preload = 'metadata';
    a.onloadedmetadata = () => res(src);
    a.onerror = () => res(null);
    a.src = src;
  }))).then(list => list.filter(Boolean));
}

function playChantFile() {
  if (!chantEl) {
    chantEl = new Audio();
    chantEl.addEventListener('ended', () => {
      chantIndex = (chantIndex + 1) % chantTracks.length;
      chantEl.src = chantTracks[chantIndex];
      chantEl.play().catch(() => {});
    });
  }
  chantEl.src = chantTracks[chantIndex];
  chantEl.volume = 0.85;
  chantEl.play().catch(() => {});
}

// — Generated fallback: low drone + slow modal melody, voice-like filtering —
function startDrone() {
  if (!ac) {
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { return; }
    droneMaster = ac.createGain();
    droneMaster.gain.value = 0;

    // simple generated reverb
    const conv = ac.createConvolver();
    const len = ac.sampleRate * 2.8;
    const ir = ac.createBuffer(2, len, ac.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = ir.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6);
    }
    conv.buffer = ir;
    const wet = ac.createGain(); wet.gain.value = .55;
    const dry = ac.createGain(); dry.gain.value = .5;
    droneMaster.connect(dry); dry.connect(ac.destination);
    droneMaster.connect(conv); conv.connect(wet); wet.connect(ac.destination);

    // sustained low drone: D2 + A2, barely there
    [[73.42, .05], [110, .035]].forEach(([f, g]) => {
      const o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = f;
      const og = ac.createGain(); og.gain.value = g;
      o.connect(og); og.connect(droneMaster); o.start();
    });
  }
  ac.resume().catch(() => {});
  droneMaster.gain.cancelScheduledValues(ac.currentTime);
  droneMaster.gain.setTargetAtTime(1, ac.currentTime, 1.2);

  // slow modal melody (D dorian), one voice, long notes
  const SCALE = [146.83, 164.81, 174.61, 196.0, 220.0, 261.63, 293.66];
  let deg = 0;
  const sing = () => {
    if (!soundOn || !ac) return;
    const dur = 2.2 + Math.random() * 2.4;
    deg = Math.max(0, Math.min(SCALE.length - 1, deg + [-2, -1, -1, 0, 1, 1, 2][Math.floor(Math.random() * 7)]));
    const f = SCALE[deg];
    const o = ac.createOscillator(); o.type = 'triangle'; o.frequency.value = f;
    // vowel-ish formants
    const f1 = ac.createBiquadFilter(); f1.type = 'bandpass'; f1.frequency.value = 560; f1.Q.value = 4;
    const f2 = ac.createBiquadFilter(); f2.type = 'bandpass'; f2.frequency.value = 1120; f2.Q.value = 6;
    const vg = ac.createGain(); vg.gain.value = 0;
    o.connect(f1); o.connect(f2);
    const fm = ac.createGain(); fm.gain.value = 1.6;
    f1.connect(fm); f2.connect(fm); fm.connect(vg); vg.connect(droneMaster);
    const t = ac.currentTime;
    vg.gain.setTargetAtTime(.11, t, dur * .3);
    vg.gain.setTargetAtTime(0, t + dur * .62, dur * .22);
    o.start(t); o.stop(t + dur + 2);
    droneTimer = setTimeout(sing, (dur + .4 + Math.random() * .9) * 1000);
  };
  clearTimeout(droneTimer);
  sing();
}

function stopAudio() {
  if (chantEl) chantEl.pause();
  clearTimeout(droneTimer);
  if (ac && droneMaster) droneMaster.gain.setTargetAtTime(0, ac.currentTime, .4);
}

function startAudio() {
  if (!soundOn) return;
  if (audioStarted) {
    if (chantTracks.length) playChantFile(); else startDrone();
    return;
  }
  audioStarted = true;
  probeChant().then(found => {
    chantTracks = found;
    if (!soundOn || !feed.classList.contains('on')) return;
    if (chantTracks.length) playChantFile(); else startDrone();
  });
}

function shuffled(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ── No-repeat engine ──
   Within one visit to the feed, nothing ever repeats. Across visits,
   an item you have seen only becomes eligible again after two more
   visits ("once every third time"); unseen items always come first. */

const keyOf = item => item.t.slice(0, 48);
let sessionNum = store.get('refuge.sessionNum', 0);
let seenMap = store.get('refuge.seen', {});

let queue = [], qPos = 0, curCat = 'pray', lastMotif = '', lastArt = '', ended = false;

function buildQueue(cat) {
  const pool = [];
  const dedup = new Set();
  for (const item of LIB[cat].items.concat(cat === 'pray' ? [] : LIB.pray.items)) {
    const k = keyOf(item);
    if (!dedup.has(k)) { dedup.add(k); pool.push(item); }
  }
  const fresh = [], rested = [], recent = [];
  for (const item of pool) {
    const last = seenMap[keyOf(item)];
    if (last === undefined) fresh.push(item);
    else if (sessionNum - last >= 3) rested.push(item);  // sat out ≥2 visits
    else recent.push(item);
  }
  // never-seen first, then rested ones, then (only if you scroll that
  // far) recently-seen — but each at most once per visit
  return shuffled(fresh).concat(shuffled(rested), shuffled(recent));
}

function markSeen(item) {
  seenMap[keyOf(item)] = sessionNum;
  store.set('refuge.seen', seenMap);
}

const seenObserver = 'IntersectionObserver' in window ? new IntersectionObserver(entries => {
  for (const en of entries) {
    if (en.isIntersecting && en.target._item) {
      markSeen(en.target._item);
      seenObserver.unobserve(en.target);
    }
  }
}, { root: null, threshold: .6 }) : null;

function nextItem() {
  return qPos < queue.length ? queue[qPos++] : null;
}

function artLayer() {
  let imgTag = '';
  if (artPool.length) {
    let u = artPool[Math.floor(Math.random() * artPool.length)];
    if (u === lastArt && artPool.length > 1) u = artPool[(artPool.indexOf(u) + 1) % artPool.length];
    lastArt = u;
    imgTag = `<img src="${u}" alt="" onerror="this.remove()">`;
  }
  return imgTag;
}

function makeSlide(item, showHint) {
  const prefs = MOTIF_PREF[curCat] || MOTIFS;
  let motif = prefs[Math.floor(Math.random() * prefs.length)];
  if (motif === lastMotif) motif = prefs[(prefs.indexOf(motif) + 1) % prefs.length];
  lastMotif = motif;

  const div = document.createElement('div');
  div.className = 'slide';
  const long = item.t.length > 120;
  div.innerHTML = `
    <div class="art">${windowSVG(motif, seedCounter++)}${artLayer()}</div>
    <div class="veil"></div>
    <div class="content">
      <div class="txt${long ? ' long' : ''}">${item.t.replace(/\n/g, '<br>')}</div>
      <div class="src">${item.s}</div>
    </div>
    ${showHint ? '<div class="hint">Pray it once, then swipe<span class="arr">↓</span></div>' : ''}`;
  div._item = item;
  if (seenObserver) seenObserver.observe(div); else markSeen(item);
  return div;
}

function makeEndSlide() {
  const div = document.createElement('div');
  div.className = 'slide';
  div.innerHTML = `
    <div class="art">${windowSVG('cross', seedCounter++)}${artLayer()}</div>
    <div class="veil"></div>
    <div class="content">
      <div class="txt">Amen.</div>
      <div class="src">You have prayed every word here.<br>Go in peace — He heard you.</div>
      <button type="button" class="home-btn" id="endHome">Return</button>
    </div>`;
  div.querySelector('#endHome').addEventListener('click', goHome);
  return div;
}

function appendNext() {
  if (ended) return;
  const it = nextItem();
  if (it) feed.appendChild(makeSlide(it, false));
  else { feed.appendChild(makeEndSlide()); ended = true; }
}

function openFeed(cat) {
  curCat = cat;
  sessionNum += 1;
  store.set('refuge.sessionNum', sessionNum);
  queue = buildQueue(cat);
  qPos = 0;
  ended = false;
  $('feedCat').textContent = LIB[cat].label;
  feed.querySelectorAll('.slide').forEach(s => s.remove());
  const first = nextItem();
  if (first) feed.appendChild(makeSlide(first, true));
  appendNext();
  feed.classList.add('on');
  home.style.display = 'none';
  feed.scrollTop = 0;
  startAudio();
}

function goHome() {
  feed.classList.remove('on');
  home.style.display = 'flex';
  stopAudio();
}
$('backBtn').addEventListener('click', goHome);

// sound toggle
const soundBtn = $('soundBtn');
function renderSoundBtn() { soundBtn.classList.toggle('off', !soundOn); }
renderSoundBtn();
soundBtn.addEventListener('click', () => {
  soundOn = !soundOn;
  store.set('refuge.sound', soundOn);
  renderSoundBtn();
  if (soundOn) startAudio(); else stopAudio();
});

// infinite scroll: keep two slides ahead, prune far behind
feed.addEventListener('scroll', () => {
  if (feed.scrollTop + feed.clientHeight * 2.2 > feed.scrollHeight) appendNext();
  const slides = feed.querySelectorAll('.slide');
  if (slides.length > 14 && feed.scrollTop > feed.clientHeight * 6) {
    for (let i = 0; i < 4; i++) slides[i].remove();
    feed.scrollTop -= feed.clientHeight * 4;
  }
}, { passive: true });

probeArt();

// ── Offline support ──
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
